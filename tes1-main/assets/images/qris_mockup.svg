      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="#ffffff" rx="20" filter="url(#shadowCard)"/>
  
  <!-- Header QRIS Banner -->
  <path d="M 0 20 Q 0 0 20 0 L 380 0 Q 400 0 400 20 L 400 80 L 0 80 Z" fill="#d97706"/>
