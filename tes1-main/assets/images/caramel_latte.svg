<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fed7aa"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#fffbeb" rx="16"/>
  <!-- Glass Cup -->
  <path d="M 105 45 L 120 165 C 122 175, 178 175, 180 165 L 195 45 Z" fill="url(#coffeeGrad)" opacity="0.95" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Ice cubes -->
  <rect x="125" y="65" width="22" height="22" rx="4" fill="#ffffff" opacity="0.75" transform="rotate(10 125 65)"/>
  <rect x="145" y="90" width="24" height="24" rx="4" fill="#ffffff" opacity="0.7" transform="rotate(-15 145 90)"/>
  <rect x="130" y="115" width="20" height="20" rx="4" fill="#ffffff" opacity="0.65" transform="rotate(25 130 115)"/>
  <!-- Caramel Drizzle on Top -->
  <path d="M 112 55 Q 130 75 145 55 Q 165 80 188 55" stroke="#b45309" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Straw -->
  <line x1="165" y1="20" x2="140" y2="160" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
</svg>

