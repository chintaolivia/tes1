<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="butter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#fffbeb" rx="16"/>
  <!-- Bread Plate Shadow -->
  <ellipse cx="150" cy="155" rx="100" ry="20" fill="#fde68a" opacity="0.6"/>
  <!-- Salt Bread Body -->
  <path d="M 60 120 C 60 85, 100 60, 150 60 C 200 60, 240 85, 240 120 C 240 145, 205 150, 150 150 C 95 150, 60 145, 60 120 Z" fill="url(#crust)" filter="url(#shadow)"/>
  <!-- Salt Bread Rolls & Slits -->
  <path d="M 90 95 C 115 80, 135 80, 155 90" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 145 90 C 170 80, 190 82, 210 98" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Butter Glaze shine -->
  <path d="M 110 75 C 135 68, 165 68, 190 76" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.8" fill="none"/>
  <!-- Maldon Sea Salt Flakes -->
  <polygon points="120,70 126,73 123,79 117,76" fill="#ffffff"/>
  <polygon points="148,66 154,68 152,75 146,72" fill="#ffffff"/>
  <polygon points="175,72 181,74 179,80 173,78" fill="#ffffff"/>
  <polygon points="135,85 140,87 138,92 133,90" fill="#ffffff"/>
  <polygon points="165,86 171,88 168,93 162,91" fill="#ffffff"/>
  <!-- Melting Butter Drop -->
  <path d="M 142 125 C 142 120, 158 120, 158 125 C 158 135, 142 135, 142 125 Z" fill="url(#butter)"/>
</svg>

